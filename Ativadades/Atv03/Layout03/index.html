<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Layout - Seção Principal</title>
</head>

<body>

  <header class="cabecalho">
    <div class="cabecalho-esquerda">

      <a href="#" class="logo-site">
        <img src="assets/images/logo.webp" alt="Logo do site" class="logo-imagem">
      </a>

      <nav class="menu-navegacao">
        <a href="#">Plataforma</a>
        <a href="#">Soluções</a>
        <a href="#">Recursos</a>
        <a href="#">Código aberto</a>
        <a href="#">Enterprise</a>
        <a href="#">Preços</a>
      </nav>

    </div>

    <div class="cabecalho-direita">
      <button class="botao-busca">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path
            d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm11 3-6-6"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <button class="botao-entrar">Entrar</button>
      <button class="botao-criar-conta">Criar conta</button>
    </div>
  </header>

  <main>
    <section class="secao-principal">

      <h1 class="titulo-principal">
        O futuro do desenvolvimento acontece em conjunto
      </h1>

      <p class="subtitulo-principal">
        As ferramentas e as tendências evoluem, mas a colaboração permanece.
        Com o GitHub, desenvolvedores, agentes e código se unem em uma única plataforma.
      </p>

      <div class="acoes-principais">
        <div class="grupo-email">
          <input class="campo-email" type="email" placeholder="Digite seu e-mail">
          <button class="botao-cadastrar">Cadastrar</button>
        </div>

        <button class="botao-copilot">
          Experimente o Copilot Free
        </button>
      </div>

    </section>
  </main>

  <div class="botao-scroll">↑</div>

</body>
</html>
